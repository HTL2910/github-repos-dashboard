<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Repos Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #0d1117; color: #e6edf3; }
    h1 { margin-bottom: 5px; }
    .subtitle { color: #8b949e; margin-bottom: 15px; }
    .profile-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .profile-box h3 { margin: 0 0 10px 0; }
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .profile-item { background: #0d1117; padding: 8px 12px; border-radius: 6px; }
    .profile-item strong { display: block; color: #8b949e; font-size: 12px; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 15px 0; }
    .chart-box { background: #0d1117; border-radius: 8px; padding: 12px; }
    .chart-box h4 { margin: 0 0 10px 0; text-align: center; font-size: 14px; }
    canvas { max-height: 220px; }
    .skills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .skill { background: #238636; padding: 4px 10px; border-radius: 12px; font-size: 13px; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
    input, select, button { padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #e6edf3; }
    button { cursor: pointer; background: #238636; border-color: #238636; }
    button:hover { background: #2ea043; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
    th { background: #161b22; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .private { background: #da3633; }
    .public { background: #238636; }
    .status { margin: 10px 0; color: #8b949e; }
    .commit { font-size: 12px; color: #8b949e; margin-top: 4px; }
    @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>📊 GitHub Repos Dashboard</h1>
  <p class="subtitle">Nhìn biểu đồ + danh sách là nắm ngay người này làm gì, chuyên môn ra sao.</p>

  <div class="profile-box" id="profileBox" style="display:none;">
    <h3>👤 Hồ sơ & Lịch sử hoạt động</h3>
    <div class="profile-grid" id="profileGrid"></div>
    <div class="charts">
      <div class="chart-box">
        <h4>Phân bố theo nhóm</h4>
        <canvas id="catChart"></canvas>
      </div>
      <div class="chart-box">
        <h4>Ngôn ngữ hay dùng</h4>
        <canvas id="langChart"></canvas>
      </div>
    </div>
    <div id="skillSummary"></div>
  </div>

  <div class="controls">
    <input type="text" id="username" placeholder="GitHub username" value="HTL2910">
    <input type="password" id="token" placeholder="Token (tùy chọn - xem private)">
    <button onclick="loadRepos()">Tải Dashboard</button>
    <select id="filter" onchange="renderTable()">
      <option value="all">Tất cả nhóm</option>
      <option value="Unity / Game">Unity / Game</option>
      <option value="AI / ML">AI / ML</option>
      <option value="Bot / Mini App">Bot / Mini App</option>
      <option value="Web / Frontend">Web / Frontend</option>
      <option value="Other">Khác</option>
    </select>
    <select id="sort" onchange="renderTable()">
      <option value="updated">Sort: Mới nhất</option>
      <option value="stars">Sort: Nhiều star</option>
      <option value="name">Sort: Tên A-Z</option>
    </select>
    <input type="text" id="search" placeholder="Tìm kiếm..." oninput="renderTable()">
  </div>

  <div class="status" id="status">Bấm Tải Dashboard để xem</div>
  <table id="table">
    <thead>
      <tr>
        <th>Repo</th>
        <th>Nhóm</th>
        <th>Language</th>
        <th>Cập nhật</th>
        <th>Stars</th>
        <th>Visibility</th>
        <th>Mô tả / History gần nhất</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    let allRepos = [];
    let userProfile = null;
    let catChart = null;
    let langChart = null;

    function categorize(repo) {
      const text = ((repo.name || "") + " " + (repo.description || "") + " " + (repo.language || "")).toLowerCase();
      if (text.includes("unity") || text.includes("game") || text.includes("shader")) return "Unity / Game";
      if (text.includes("ai") || text.includes("ml") || text.includes("learning") || text.includes("gpt") || text.includes("llm")) return "AI / ML";
      if (text.includes("zalo") || text.includes("bot") || text.includes("miniapp")) return "Bot / Mini App";
      if (text.includes("react") || text.includes("web") || text.includes("frontend") || text.includes("html")) return "Web / Frontend";
      return "Other";
    }

    function updateCharts() {
      const counts = {};
      allRepos.forEach(r => { counts[r.category] = (counts[r.category] || 0) + 1; });
      const langs = {};
      allRepos.forEach(r => { if (r.language) langs[r.language] = (langs[r.language] || 0) + 1; });

      const catLabels = Object.keys(counts);
      const catData = Object.values(counts);
      const langEntries = Object.entries(langs).sort((a,b)=>b[1]-a[1]).slice(0, 6);
      const langLabels = langEntries.map(e => e[0]);
      const langData = langEntries.map(e => e[1]);

      const colors = ["#238636", "#1f6feb", "#da3633", "#d29922", "#8957e5", "#8b949e"];

      if (catChart) catChart.destroy();
      catChart = new Chart(document.getElementById("catChart"), {
        type: "doughnut",
        data: { labels: catLabels, datasets: [{ data: catData, backgroundColor: colors }] },
        options: { plugins: { legend: { position: "bottom", labels: { color: "#e6edf3" } } } }
      });

      if (langChart) langChart.destroy();
      langChart = new Chart(document.getElementById("langChart"), {
        type: "bar",
        data: { labels: langLabels, datasets: [{ data: langData, backgroundColor: "#1f6feb" }] },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
            x: { ticks: { color: "#e6edf3" }, grid: { display: false } }
          }
        }
      });
    }

    function updateProfile() {
      if (!userProfile) return;
      const joinDate = userProfile.created_at ? new Date(userProfile.created_at).toLocaleDateString("vi-VN") : "-";

      document.getElementById("profileGrid").innerHTML = `
        <div class="profile-item"><strong>Tham gia</strong>${joinDate}</div>
        <div class="profile-item"><strong>Public repos</strong>${userProfile.public_repos || 0}</div>
        <div class="profile-item"><strong>Followers</strong>${userProfile.followers || 0}</div>
        <div class="profile-item"><strong>Tổng repo hiển thị</strong>${allRepos.length}</div>
      `;

      const langs = {};
      allRepos.forEach(r => { if (r.language) langs[r.language] = (langs[r.language] || 0) + 1; });
      const topLangs = Object.entries(langs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([l,c]) => `${l} (${c})`);

      document.getElementById("skillSummary").innerHTML = `
        <div><strong>Kỹ năng / Ngôn ngữ:</strong></div>
        <div class="skills">${topLangs.map(l => `<span class="skill">${l}</span>`).join("") || "-"}</div>
        ${userProfile.bio ? `<div style="margin-top:10px;"><strong>Bio:</strong> ${userProfile.bio}</div>` : ""}
      `;

      updateCharts();
      document.getElementById("profileBox").style.display = "block";
    }

    async function loadRepos() {
      const username = document.getElementById("username").value.trim() || "HTL2910";
      const token = document.getElementById("token").value.trim();
      const status = document.getElementById("status");
      status.textContent = "Đang tải...";

      const headers = { "Accept": "application/vnd.github+json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;

      try {
        const userRes = await fetch(`https://api.github.com/users/${username}`, { headers });
        if (userRes.ok) userProfile = await userRes.json();

        let repos = [];
        let page = 1;
        while (page <= 5) {
          const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&page=${page}&sort=updated&type=owner`, { headers });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data.length) break;
          repos = repos.concat(data);
          page++;
        }

        const withHistory = [];
        for (const r of repos.slice(0, 25)) {
          let lastCommit = "-";
          try {
            const cRes = await fetch(`https://api.github.com/repos/${username}/${r.name}/commits?per_page=1`, { headers });
            if (cRes.ok) {
              const commits = await cRes.json();
              if (commits[0]) {
                const msg = commits[0].commit.message.split("\n")[0].slice(0, 70);
                const date = commits[0].commit.author.date.slice(0, 10);
                lastCommit = `${date}: ${msg}`;
              }
            }
          } catch {}
          withHistory.push({ ...r, category: categorize(r), lastCommit });
        }
        for (const r of repos.slice(25)) {
          withHistory.push({ ...r, category: categorize(r), lastCommit: "-" });
        }

        allRepos = withHistory;
        status.textContent = `Đã tải ${allRepos.length} repo của ${username}`;
        updateProfile();
        renderTable();
      } catch (e) {
        status.textContent = "Lỗi: " + e.message;
      }
    }

    function renderTable() {
      const filter = document.getElementById("filter").value;
      const search = document.getElementById("search").value.toLowerCase();
      const sort = document.getElementById("sort").value;
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = "";

      let filtered = allRepos.filter(r => {
        if (filter !== "all" && r.category !== filter) return false;
        const text = (r.name + " " + (r.description || "") + " " + (r.lastCommit || "")).toLowerCase();
        return text.includes(search);
      });

      if (sort === "updated") filtered.sort((a,b) => (b.updated_at || "").localeCompare(a.updated_at || ""));
      else if (sort === "stars") filtered.sort((a,b) => (b.stargazers_count || 0) - (a.stargazers_count || 0));
      else if (sort === "name") filtered.sort((a,b) => a.name.localeCompare(b.name));

      filtered.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="${r.html_url}" target="_blank"><strong>${r.name}</strong></a></td>
          <td>${r.category}</td>
          <td>${r.language || "-"}</td>
          <td>${(r.updated_at || "").slice(0, 10)}</td>
          <td>${r.stargazers_count || 0}</td>
          <td><span class="badge ${r.private ? "private" : "public"}">${r.private ? "Private" : "Public"}</span></td>
          <td>
            ${(r.description || "-").slice(0, 90)}
            <div class="commit">📝 ${r.lastCommit || "-"}</div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
